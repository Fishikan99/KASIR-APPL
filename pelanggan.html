<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Order Online - KasirPO</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- SDK Firebase CDN (Required for Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <h1>KASIRPO ONLINE</h1>
        <p>Formulir Pre-Order Mandiri Pelanggan</p>
    </header>

    <main>
        <section class="page" style="max-width: 600px; margin: 20px auto;">
            <h2>Form Pre-Order Barang</h2>
            <p>Silakan isi detail pesanan Anda di bawah ini:</p>

            <div class="form" style="display: flex; flex-direction: column; gap: 12px;">
                <label for="namaPelanggan"><b>Nama Anda:</b></label>
                <input type="text" id="namaPelanggan" placeholder="Masukkan Nama Lengkap">

                <label for="barangPreOrder"><b>Nama Barang / Pesanan:</b></label>
                <input type="text" id="barangPreOrder" placeholder="Contoh: Kemeja Custom L">

                <label for="jumlahPreOrder"><b>Jumlah Pesanan:</b></label>
                <input type="number" id="jumlahPreOrder" value="1" min="1">

                <label for="tanggalAmbil"><b>Tanggal Rencana Ambil:</b></label>
                <input type="date" id="tanggalAmbil">

                <button type="button" onclick="estimasiTanggalPO()" style="background-color: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">
                    ⚡ Hitung Estimasi Otomatis (Smart System)
                </button>

                <button type="button" onclick="tambahPreOrderPelanggan()" style="background-color: #28a745; color: white; padding: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
                    Kirim Pesanan Pre-Order
                </button>
            </div>
        </section>
    </main>

    <!-- File JavaScript Utama -->
    <script src="script.js"></script>
</body>
</html>
